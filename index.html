<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日常分享</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}

/* ── Header ── */
.hdr{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.06);z-index:100}
.hdr-title{font-size:17px;font-weight:600;color:#1A1A1A;letter-spacing:.3px}
.hdr-actions{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.hdr-btn{background:none;border:none;cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s}
.hdr-btn:active{background:#F0F0F0}
.hdr-btn svg{width:22px;height:22px;color:#555}

/* ── Tabs ── */
.tabs{position:fixed;top:56px;left:0;right:0;height:44px;background:#fff;display:flex;border-bottom:1px solid rgba(0,0,0,.06);z-index:99}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:#888;cursor:pointer;border:none;background:none;font-family:inherit;position:relative;transition:color .2s}
.tab.active{color:#5B9BD5;font-weight:600}
.tab.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:#5B9BD5;border-radius:2px}

/* ── Main ── */
.main{padding-top:100px;padding-bottom:90px}

/* ── Waterfall Grid ── */
.grid{column-count:2;column-gap:10px;padding:12px}

/* ── Photo Card ── */
.card{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px;break-inside:avoid;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:cardIn .35s ease-out;position:relative}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card img{width:100%;display:block;background:#EDEDED;min-height:80px}
.card-body{padding:10px 12px 12px}
.card-desc{font-size:13px;line-height:1.6;color:#333;margin:0;word-break:break-word}
.card-nick{font-size:11px;color:#5B9BD5;margin-top:6px;display:flex;align-items:center;gap:4px}
.card-nick-avatar{width:16px;height:16px;border-radius:8px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.card-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.card-time{font-size:11px;color:#B0B0B0}
.card-acts{display:flex;align-items:center;gap:14px}
.act-btn{display:flex;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:2px;font-family:inherit;color:#999;transition:color .2s}
.act-btn.liked{color:#FF6B81}
.act-btn.liked .heart-icon{fill:#FF6B81}
.act-btn .heart-icon{transition:all .2s}
.act-btn .like-count{font-size:12px;min-width:12px;text-align:center}

/* ── Delete Button ── */
.del-btn{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;z-index:10;transition:background .15s}
.del-btn:active{background:rgba(220,50,50,.8)}
.admin-mode .del-btn{display:flex}

/* ── Empty State ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:100px;color:#BCBCBC}
.empty svg{width:52px;height:52px;stroke-width:1.2}
.empty p{margin-top:16px;font-size:15px;text-align:center;line-height:1.6}

/* ── Ranking List ── */
.rank-list{padding:12px}
.rank-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:cardIn .35s ease-out}
.rank-badge{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.rank-badge.top1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#fff}
.rank-badge.top2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:#fff}
.rank-badge.top3{background:linear-gradient(135deg,#CD7F32,#A0522D);color:#fff}
.rank-badge.normal{background:#F5F7FA;color:#888}
.rank-img{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#EDEDED}
.rank-info{flex:1;min-width:0}
.rank-desc{font-size:13px;color:#333;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rank-meta{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:11px;color:#B0B0B0}
.rank-likes{display:flex;align-items:center;gap:3px;color:#FF6B81}
.rank-likes svg{width:12px;height:12px;fill:#FF6B81}

/* ── User List ── */
.user-list{padding:12px}
.user-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:14px 12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:cardIn .35s ease-out}
.user-avatar{width:44px;height:44px;border-radius:22px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-nick{font-size:14px;font-weight:500;color:#1A1A1A}
.user-stats{display:flex;gap:16px;margin-top:4px;font-size:11px;color:#B0B0B0}
.user-stat{display:flex;align-items:center;gap:3px}
.user-stat svg{width:12px;height:12px}

/* ── FAB ── */
.fab{position:fixed;bottom:28px;right:20px;width:56px;height:56px;border-radius:28px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(91,155,213,.4);cursor:pointer;z-index:90;transition:transform .15s,box-shadow .15s}
.fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(91,155,213,.3)}
.fab svg{width:24px;height:24px}

/* ── Overlay ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── Modal ── */
.modal{width:100%;max-width:420px;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 28px;max-height:92vh;overflow-y:auto;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-close{display:flex;justify-content:flex-end;margin-bottom:4px}
.modal-close-btn{width:30px;height:30px;border-radius:15px;background:#F2F2F2;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;transition:background .15s}
.modal-close-btn:active{background:#E5E5E5}
.modal-close-btn svg{width:16px;height:16px}
.modal-title{font-size:17px;font-weight:600;color:#1A1A1A;text-align:center;margin-bottom:16px}

/* ── Upload Source ── */
.src-row{display:flex;gap:12px;margin-top:8px}
.src-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;border-radius:12px;border:1.5px solid #E8E8E8;background:#FAFAFA;cursor:pointer;transition:all .15s;font-family:inherit}
.src-btn:active{background:#F0F0F0;border-color:#D0D0D0}
.src-btn span{font-size:13px;color:#555}

/* ── Preview ── */
.preview-wrap{position:relative;border-radius:12px;overflow:hidden;margin-bottom:16px;background:#F5F5F5}
.preview-img{width:100%;display:block;max-height:280px;object-fit:contain}
.preview-rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.5);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}

/* ── Form ── */
.input-field{width:100%;padding:12px 14px;border:1.5px solid #E8E8E8;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;margin-bottom:12px}
.input-field:focus{border-color:#5B9BD5}
.desc-input{width:100%;padding:12px 14px;border:1.5px solid #E8E8E8;border-radius:10px;font-size:14px;font-family:inherit;outline:none;resize:none;height:72px;transition:border-color .15s;margin-bottom:4px}
.desc-input:focus{border-color:#5B9BD5}
.desc-count{font-size:11px;color:#B0B0B0;text-align:right;margin-bottom:16px}
.post-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#5B9BD5,#4A89C8);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .15s}
.post-btn:active{opacity:.85}
.post-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Settings ── */
.settings-status{padding:12px;border-radius:10px;font-size:13px;line-height:1.6;margin-bottom:16px}
.settings-status.info{background:#F0F7FF;color:#4A89C8}
.settings-status.ok{background:#F0FFF4;color:#38A169}
.settings-status.err{background:#FFF5F5;color:#E53E3E}
.settings-status a{color:inherit;text-decoration:underline}
.settings-status strong{display:block;margin-bottom:6px}

/* ── QR ── */
.qr-sheet{width:100%;max-width:360px;background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 28px;text-align:center}
.qr-title{font-size:17px;font-weight:600;color:#1A1A1A;margin-bottom:8px}
.qr-sub{font-size:13px;color:#888;margin-bottom:20px}
.qr-box{display:flex;justify-content:center;margin-bottom:16px}
.qr-url-row{display:flex;align-items:center;gap:8px;background:#F5F6F8;border-radius:10px;padding:10px 12px}
.qr-url{flex:1;font-size:12px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.qr-copy{padding:6px 14px;border:none;border-radius:8px;background:#5B9BD5;color:#fff;font-size:12px;font-family:inherit;cursor:pointer}
.qr-tip{font-size:11px;color:#B0B0B0;margin-top:16px;line-height:1.5}
.share-cancel{width:100%;padding:14px;border:none;border-radius:12px;background:#F2F2F2;color:#555;font-size:15px;font-family:inherit;cursor:pointer;margin-top:12px}

/* ── Toast ── */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── Loading ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:#B0B0B0;font-size:14px}

/* ── Tab Content ── */
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>
<body>

<!-- Header -->
<header class="hdr">
  <span class="hdr-title">日常分享</span>
  <div class="hdr-actions">
    <button class="hdr-btn" onclick="openQR()" title="分享二维码">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="14" width="3" height="3"/><rect x="14" y="18" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg>
    </button>
    <button class="hdr-btn" onclick="openSettings()" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-tab="photos" onclick="switchTab('photos')">照片墙</button>
  <button class="tab" data-tab="rankings" onclick="switchTab('rankings')">排行榜</button>
  <button class="tab" data-tab="users" onclick="switchTab('users')">参与者</button>
</div>

<!-- Main Content -->
<div class="main">
  <div id="tab-photos" class="tab-content active">
    <div id="grid" class="grid"></div>
  </div>
  <div id="tab-rankings" class="tab-content">
    <div id="rankList" class="rank-list"></div>
  </div>
  <div id="tab-users" class="tab-content">
    <div id="userList" class="user-list"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openUpload()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- Upload Modal -->
<div id="uploadOv" class="ov" style="display:none" onclick="closeUpload(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-close">
      <button class="modal-close-btn" onclick="closeUpload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="uploadBody"></div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settingsOv" class="ov" style="display:none" onclick="closeSettings(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-close">
      <button class="modal-close-btn" onclick="closeSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="modal-title">设置</p>
    <div id="cfgStatus" class="settings-status info">
      <strong>如何配置？</strong>
      1. 创建 GitHub 仓库（私有）<br>
      2. 生成 Personal Access Token<br>
      3. 在仓库中创建 photos.json 文件<br>
      4. 填入下方配置项
    </div>
    <input id="cfgOwner" class="input-field" placeholder="GitHub 用户名">
    <input id="cfgRepo" class="input-field" placeholder="仓库名称">
    <input id="cfgToken" class="input-field" placeholder="Personal Access Token" type="password">
    <input id="cfgAdmin" class="input-field" placeholder="管理员密码（可选）" type="password">
    <button class="post-btn" onclick="saveSettings()">保存配置</button>
  </div>
</div>

<!-- QR Modal -->
<div id="qrOv" class="ov" style="display:none" onclick="closeQR(event)">
  <div class="qr-sheet" onclick="event.stopPropagation()">
    <p class="qr-title">扫码参与</p>
    <p class="qr-sub">扫描下方二维码，打开页面参与分享</p>
    <div id="qrBox" class="qr-box"></div>
    <div class="qr-url-row">
      <div id="qrUrl" class="qr-url"></div>
      <button class="qr-copy" onclick="copyURL()">复制</button>
    </div>
    <p class="qr-tip">提示：需将页面部署到线上服务器后，<br>他人扫码才能正常访问</p>
    <button class="share-cancel" style="margin-top:18px" onclick="closeQR()">关闭</button>
  </div>
</div>

<!-- Hidden file inputs -->
<input id="camIn" type="file" accept="image/*" capture="environment" style="display:none">
<input id="albIn" type="file" accept="image/*" style="display:none">

<script>
/* ═══ State ═══ */
let photos = [];
let likedPhotos = new Set();
let currentTab = 'photos';
let isAdmin = false;
let ghConfig = null;

/* ═══ SVG Icons ═══ */
const IC = {
  heart: (f) => `<svg class="heart-icon" width="16" height="16" viewBox="0 0 24 24" fill="${f?'#FF6B81':'none'}" stroke="${f?'#FF6B81':'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  share: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
  x: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  cam: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  up: `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5B9BD5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>`,
  empty: `<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  photo: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  heart12: `<svg width="12" height="12" viewBox="0 0 24 24" fill="#FF6B81" stroke="#FF6B81" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
};

/* ═══ GitHub Config ═══ */
function getConfig() {
  return {
    owner: localStorage.getItem('gh_owner') || '',
    repo: localStorage.getItem('gh_repo') || '',
    token: localStorage.getItem('gh_token') || '',
    adminPwd: localStorage.getItem('gh_admin') || ''
  };
}

function initGitHub() {
  const cfg = getConfig();
  if (cfg.owner && cfg.repo && cfg.token) {
    ghConfig = cfg;
    return true;
  }
  return false;
}

/* ═══ GitHub API ═══ */
async function fetchPhotosJSON() {
  if (!ghConfig) return null;
  const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/photos.json`;
  const res = await fetch(url, {
    headers: { 'Authorization': `token ${ghConfig.token}` }
  });
  if (!res.ok) return null;
  const data = await res.json();
  const content = atob(data.content.replace(/\n/g, ''));
  return { content: JSON.parse(content), sha: data.sha };
}

async function updatePhotosJSON(photos) {
  if (!ghConfig) return false;
  const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/photos.json`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(photos, null, 2))));
  
  // Get current SHA
  const res = await fetch(url, {
    headers: { 'Authorization': `token ${ghConfig.token}` }
  });
  if (!res.ok) return false;
  const data = await res.json();
  
  // Update
  const putRes = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${ghConfig.token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'Update photos',
      content: content,
      sha: data.sha
    })
  });
  return putRes.ok;
}

/* ═══ GitHub Image Upload ═══ */
async function uploadToGitHub(file, filename) {
  const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/images/${filename}`;
  
  // Read file as base64
  const base64 = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64Str = dataUrl.split(',')[1];
      resolve(base64Str);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${ghConfig.token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: `Add image ${filename}`,
      content: base64,
      branch: 'main'
    })
  });
  
  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData.message || `上传失败 (${res.status})`);
  }
  
  const data = await res.json();
  // Use jsdelivr CDN for image access (works in China)
  return `https://cdn.jsdelivr.net/gh/${ghConfig.owner}/${ghConfig.repo}@main/images/${filename}`;
}

/* ═══ Load Photos ═══ */
async function loadPhotos() {
  if (!ghConfig) return false;
  try {
    const result = await fetchPhotosJSON();
    if (!result) return false;
    photos = result.content || [];
    // Load liked state
    const liked = localStorage.getItem('liked_photos');
    if (liked) likedPhotos = new Set(JSON.parse(liked));
    return true;
  } catch (e) {
    console.error('Load photos error:', e);
    return false;
  }
}

/* ═══ Render Photos ═══ */
function renderPhotos() {
  const g = document.getElementById('grid');
  if (!photos.length) {
    if (!ghConfig) {
      g.innerHTML = `<div class="empty">${IC.empty}<p>请先点击右上角 ⚙️ 设置<br>配置 GitHub 仓库</p></div>`;
    } else {
      g.innerHTML = `<div class="empty">${IC.empty}<p>还没有照片，快来分享第一张吧</p></div>`;
    }
    return;
  }
  g.innerHTML = photos.map(p => {
    const liked = likedPhotos.has(p.id);
    return `
    <div class="card">
      ${isAdmin ? `<button class="del-btn" onclick="deletePhoto(${p.id})">✕</button>` : ''}
      <img src="${p.url}" alt="" loading="lazy">
      <div class="card-body">
        <p class="card-desc">${escHtml(p.description || '')}</p>
        ${p.nickname ? `<div class="card-nick"><span class="card-nick-avatar">${escHtml(p.nickname[0])}</span>${escHtml(p.nickname)}</div>` : ''}
        <div class="card-row">
          <span class="card-time">${formatTime(p.created_at)}</span>
          <div class="card-acts">
            <button class="act-btn${liked?' liked':''}" onclick="toggleLike(${p.id})">${IC.heart(liked)}<span class="like-count">${p.likes || 0}</span></button>
            <button class="act-btn" onclick="openShare()">${IC.share}</button>
          </div>
        </div>
      </div>
    </div>
  `}).join('');
}

/* ═══ Render Rankings ═══ */
function renderRankings() {
  const list = document.getElementById('rankList');
  if (!photos.length) {
    list.innerHTML = `<div class="empty">${IC.empty}<p>暂无排行数据</p></div>`;
    return;
  }
  const ranked = [...photos].sort((a, b) => (b.likes || 0) - (a.likes || 0)).slice(0, 20);
  list.innerHTML = ranked.map((p, i) => {
    const rank = i + 1;
    const badgeClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : 'normal';
    return `
      <div class="rank-item">
        <div class="rank-badge ${badgeClass}">${rank}</div>
        <img class="rank-img" src="${p.url}" alt="" loading="lazy">
        <div class="rank-info">
          <p class="rank-desc">${escHtml(p.description || '')}</p>
          <div class="rank-meta">
            ${p.nickname ? `<span>${escHtml(p.nickname)}</span>` : ''}
            <span class="rank-likes">${IC.heart12}${p.likes || 0}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

/* ═══ Render Users ═══ */
function renderUsers() {
  const list = document.getElementById('userList');
  if (!photos.length) {
    list.innerHTML = `<div class="empty">${IC.empty}<p>暂无用户数据</p></div>`;
    return;
  }
  const userMap = {};
  photos.forEach(p => {
    const nick = p.nickname || '匿名';
    if (!userMap[nick]) userMap[nick] = {nickname: nick, photoCount: 0, totalLikes: 0};
    userMap[nick].photoCount++;
    userMap[nick].totalLikes += (p.likes || 0);
  });
  const users = Object.values(userMap).sort((a, b) => b.photoCount - a.photoCount);
  list.innerHTML = users.map(u => `
    <div class="user-item">
      <div class="user-avatar">${escHtml(u.nickname[0])}</div>
      <div class="user-info">
        <div class="user-nick">${escHtml(u.nickname)}</div>
        <div class="user-stats">
          <span class="user-stat">${IC.photo}${u.photoCount} 张照片</span>
          <span class="user-stat">${IC.heart12}${u.totalLikes} 获赞</span>
        </div>
      </div>
    </div>
  `).join('');
}

/* ═══ Tab Switch ═══ */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (tab === 'photos') renderPhotos();
  else if (tab === 'rankings') renderRankings();
  else if (tab === 'users') renderUsers();
}

/* ═══ Like Photo ═══ */
async function toggleLike(id) {
  if (!ghConfig) return toast('请先设置 GitHub 仓库');
  const photo = photos.find(p => p.id === id);
  if (!photo) return;

  if (likedPhotos.has(id)) {
    likedPhotos.delete(id);
    photo.likes = Math.max(0, (photo.likes || 0) - 1);
  } else {
    likedPhotos.add(id);
    photo.likes = (photo.likes || 0) + 1;
  }
  
  // Save to GitHub
  await updatePhotosJSON(photos);
  
  // Save liked state locally
  localStorage.setItem('liked_photos', JSON.stringify([...likedPhotos]));
  
  // Re-render
  if (currentTab === 'photos') renderPhotos();
  else if (currentTab === 'rankings') renderRankings();
}

/* ═══ Delete Photo (Admin) ═══ */
async function deletePhoto(id) {
  if (!isAdmin || !ghConfig) return;
  if (!confirm('确定删除这张照片吗？')) return;

  photos = photos.filter(p => p.id !== id);
  const ok = await updatePhotosJSON(photos);
  if (ok) {
    renderPhotos();
    toast('已删除');
  } else {
    toast('删除失败，请重试');
  }
}

/* ═══ Upload Flow ═══ */
let pendingImage = null;

function openUpload() {
  if (!ghConfig) {
    toast('请先点击右上角 ⚙️ 设置 GitHub 仓库');
    openSettings();
    return;
  }
  pendingImage = null;
  showUploadSource();
  document.getElementById('uploadOv').style.display = 'flex';
}

function showUploadSource() {
  document.getElementById('uploadBody').innerHTML = `
    <p class="modal-title">分享照片</p>
    <div class="src-row">
      <button class="src-btn" onclick="document.getElementById('camIn').click()">
        ${IC.cam}
        <span>拍照</span>
      </button>
      <button class="src-btn" onclick="document.getElementById('albIn').click()">
        ${IC.up}
        <span>从相册选择</span>
      </button>
    </div>
  `;
}

function showUploadPreview(dataUrl) {
  pendingImage = dataUrl;
  document.getElementById('uploadBody').innerHTML = `
    <p class="modal-title">编辑照片</p>
    <div class="preview-wrap">
      <img class="preview-img" src="${dataUrl}" alt="预览">
      <button class="preview-rm" onclick="showUploadSource()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <input id="nickInput" class="input-field" placeholder="你的昵称" maxlength="20">
    <textarea id="descInput" class="desc-input" placeholder="说点什么..." maxlength="200" oninput="document.getElementById('descCount').textContent=this.value.length+'/200'"></textarea>
    <div id="descCount" class="desc-count">0/200</div>
    <button id="postBtn" class="post-btn" onclick="submitPhoto()">发布</button>
  `;
}

async function submitPhoto() {
  if (!pendingImage || !ghConfig) return;
  const nickname = document.getElementById('nickInput').value.trim() || '匿名';
  const description = document.getElementById('descInput').value.trim();
  const btn = document.getElementById('postBtn');
  btn.disabled = true;
  btn.textContent = '发布中...';

  try {
    // Convert data URL to blob
    const blob = await dataURLtoBlob(pendingImage);
    // Upload to GitHub
    const ext = pendingImage.split(';')[0].split('/')[1] || 'jpg';
    const filename = `${Date.now()}_${Math.random().toString(36).substr(2, 6)}.${ext}`;
    const imageUrl = await uploadToGitHub(blob, filename);
    
    // Create photo object
    const newPhoto = {
      id: Date.now(),
      url: imageUrl,
      description: description,
      nickname: nickname,
      likes: 0,
      created_at: new Date().toISOString()
    };
    
    // Add to photos array
    photos.unshift(newPhoto);
    
    // Save to GitHub
    const ok = await updatePhotosJSON(photos);
    if (!ok) throw new Error('保存失败');
    
    toast('发布成功！');
    closeUpload();
    switchTab('photos');
  } catch (e) {
    console.error('Submit error:', e);
    toast(e.message || '发布失败，请重试');
    btn.disabled = false;
    btn.textContent = '发布';
  }
}

function dataURLtoBlob(dataUrl) {
  return new Promise((resolve, reject) => {
    const arr = dataUrl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    resolve(new Blob([u8arr], { type: mime }));
  });
}

function closeUpload(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('uploadOv').style.display = 'none';
  pendingImage = null;
}

/* ═══ File Input Handlers ═══ */
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => showUploadPreview(ev.target.result);
  reader.readAsDataURL(file);
  e.target.value = '';
}

document.getElementById('camIn').addEventListener('change', handleFileSelect);
document.getElementById('albIn').addEventListener('change', handleFileSelect);

/* ═══ Settings ═══ */
function openSettings() {
  const cfg = getConfig();
  document.getElementById('cfgOwner').value = cfg.owner;
  document.getElementById('cfgRepo').value = cfg.repo;
  document.getElementById('cfgToken').value = cfg.token;
  document.getElementById('cfgAdmin').value = cfg.adminPwd;
  updateSettingsStatus();
  document.getElementById('settingsOv').style.display = 'flex';
}

function closeSettings(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('settingsOv').style.display = 'none';
}

function updateSettingsStatus() {
  const owner = document.getElementById('cfgOwner').value.trim();
  const repo = document.getElementById('cfgRepo').value.trim();
  const token = document.getElementById('cfgToken').value.trim();
  const statusEl = document.getElementById('cfgStatus');
  if (!owner && !repo && !token) {
    statusEl.className = 'settings-status info';
    statusEl.innerHTML = '<strong>如何配置？</strong>1. 创建 GitHub 仓库（私有）<br>2. 生成 Personal Access Token<br>3. 在仓库中创建 photos.json 文件<br>4. 填入下方配置项';
  } else if (owner && repo && token) {
    statusEl.className = 'settings-status ok';
    statusEl.textContent = '✓ 配置已就绪';
  } else {
    statusEl.className = 'settings-status err';
    statusEl.textContent = '请填写完整的用户名、仓库名和 Token';
  }
}

document.getElementById('cfgOwner').addEventListener('input', updateSettingsStatus);
document.getElementById('cfgRepo').addEventListener('input', updateSettingsStatus);
document.getElementById('cfgToken').addEventListener('input', updateSettingsStatus);

async function saveSettings() {
  const owner = document.getElementById('cfgOwner').value.trim();
  const repo = document.getElementById('cfgRepo').value.trim();
  const token = document.getElementById('cfgToken').value.trim();
  const adminPwd = document.getElementById('cfgAdmin').value.trim();

  if (!owner || !repo || !token) { toast('请填写完整配置'); return; }

  localStorage.setItem('gh_owner', owner);
  localStorage.setItem('gh_repo', repo);
  localStorage.setItem('gh_token', token);
  if (adminPwd) localStorage.setItem('gh_admin', adminPwd);
  else localStorage.removeItem('gh_admin');

  // Re-init
  if (initGitHub()) {
    toast('保存成功！');
    closeSettings();
    // Check admin mode
    if (adminPwd) {
      isAdmin = true;
      document.body.classList.add('admin-mode');
    } else {
      isAdmin = false;
      document.body.classList.remove('admin-mode');
    }
    // Load photos
    const g = document.getElementById('grid');
    g.innerHTML = '<div class="loading">加载中...</div>';
    const ok = await loadPhotos();
    if (ok) renderPhotos();
    else g.innerHTML = `<div class="empty">${IC.empty}<p>加载失败<br><span style="font-size:12px;color:#ccc">请检查仓库配置或 photos.json 是否存在</span></p></div>`;
  } else {
    toast('初始化失败');
  }
}

/* ═══ Admin Auth ═══ */
function checkAdmin() {
  const cfg = getConfig();
  if (cfg.adminPwd) {
    isAdmin = false;
    document.body.classList.remove('admin-mode');
  } else {
    isAdmin = true;
    document.body.classList.add('admin-mode');
  }
}

/* ═══ QR Code ═══ */
function openQR() {
  const url = window.location.href;
  document.getElementById('qrUrl').textContent = url;
  document.getElementById('qrBox').innerHTML = '';
  new QRCode(document.getElementById('qrBox'), {
    text: url,
    width: 180,
    height: 180,
    colorDark: '#1A1A1A',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  document.getElementById('qrOv').style.display = 'flex';
}

function closeQR(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('qrOv').style.display = 'none';
}

function copyURL() {
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(() => toast('已复制'));
}

/* ═══ Share ═══ */
function openShare() {
  if (navigator.share) {
    navigator.share({ title: '日常分享', url: window.location.href });
  } else {
    copyURL();
  }
}

/* ═══ Utils ═══ */
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

/* ═══ Init ═══ */
(async function init() {
  const g = document.getElementById('grid');
  
  if (initGitHub()) {
    checkAdmin();
    g.innerHTML = '<div class="loading">加载中...</div>';
    const ok = await loadPhotos();
    if (ok) {
      renderPhotos();
    } else {
      g.innerHTML = `<div class="empty">${IC.empty}<p>加载失败<br><span style="font-size:12px;color:#ccc">请检查仓库配置或 photos.json 是否存在</span></p></div>`;
    }
  } else {
    g.innerHTML = `<div class="empty">${IC.empty}<p>欢迎使用日常分享<br><span style="font-size:12px;color:#ccc">请先点击右上角 ⚙️ 设置 GitHub 仓库</span></p></div>`;
  }
})();
</script>
